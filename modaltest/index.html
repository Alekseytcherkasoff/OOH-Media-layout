<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Modal</title>
  </head>
  <body>
    <div id="success-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">Всплывашка Спасибо</span>
          <span class="close-button">&times;</span>
          <!-- Кнопка закрытия -->
        </div>
        <div class="modal-body">
          <div class="modal-left-side">
            <div class="modal-logo">
              <img src="" alt="OOHMEDIA Logo" />
              <!-- Укажите путь к вашему лого -->
            </div>
            <div class="modal-text-block">
              <p class="modal-subtitle">Заявка успешно отправлена</p>
              <h1 class="modal-main-text">СПАСИБО!</h1>
              <p class="modal-description">
                В ближайшее время с вами свяжется<br />
                наш менеджер для уточнения деталей<br />
                заявки
              </p>
            </div>
          </div>
          <div class="modal-right-side">
            <img src="" alt="Девушка в кепке" />
            <!-- То же изображение, что и в форме -->
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
